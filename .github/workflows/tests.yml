name: tests

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      # clang-tidy needs nvcc's toolkit and runs locally through pre-commit.
      - name: Format, lint, types, spelling
        run: uvx pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: clang-tidy,check-size-limits,mypy
      - name: Size limits
        run: python3 tools/check_size_limits.py
      # Report only until the 157 findings left after the first annotation pass are fixed.
      - name: Types
        continue-on-error: true
        run: uvx pre-commit run mypy --all-files --hook-stage manual

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported version, and the version the tolerances are calibrated against.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # jax pinned to the version the tolerances are calibrated against (pyproject holds the API floor).
      # exogibbs --no-deps: only pandas is needed (exogibbs.io.load_data);
      # pyfastchem has no linux-aarch64 wheel.
      - name: Install
        run: |
          python -m pip install --no-deps "exogibbs==0.6.0"
          python -m pip install pandas
          python -m pip install -e ".[dev,plot]" "jax==0.6.2"
      - name: Show resolved versions
        run: python -c "import jax, numpy, scipy, vulcan3; print('jax', jax.__version__, '| numpy', numpy.__version__, '| scipy', scipy.__version__, '| vulcan3', vulcan3.__version__)"
      # The master-oracle tests skip here ($VULCAN_MASTER_DIR is unset); the
      # release gate oracle.yml runs them against the pinned upstream clone.
      # ALLOW_MISSING_FIXTURES: the .npz fixtures are gitignored; their cases skip.
      # The normal tier: `slow` tests (minutes or GBs of their own) skip
      # without VULCAN3_RUN_SLOW; oracle.yml runs them.
      - name: Run tests
        env:
          VULCAN3_ALLOW_MISSING_FIXTURES: "1"
        # Three workers: four exceed the 16 GB runner.
        run: python -m pytest tests -n 3 -q --tb=short -ra --durations=15

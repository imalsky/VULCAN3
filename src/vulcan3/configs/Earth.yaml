# VULCAN3 configuration (Earth). Overlays default.yaml: only the knobs that
# differ from it are set here; every other knob takes its default.yaml value.
# Derived at load time (see config._DERIVED), do NOT add here:
#   dt_max = min(runtime*1e-5, 1e15), photo_switch_longdy_thresh = yconv_min*10,
#   para_anaTP = para_warm.
# Gravity is derived as gs = G*Mp/Rp^2 (set Mp + Rp, not gs).
#
# VULCAN 2's Earth example (cfg_examples/vulcan_cfg_Earth.py of the pinned clones), with O2 pinned at the surface at
# 0.2: the example has no O2 source, so its bottom fluxes burn the O2 and the column has no steady state (notes
# "Earth and K2-18b"). Network, atm and NASA-9 files are the pinned clones' (tests/science_sources.yaml).

# ====== Setting up the elements included in the network ======
atom_list:
- H
- O
- C
- N
- S

# ====== Setting up paths and filenames for the input and output files ======
network: thermo/SNCHO_full_photo_network.txt
atm_file: atm/atm_Earth_Jan_Kzz.txt
sflux_file: atm/stellar_flux/Gueymard_solar.txt
bot_BC_flux_file: atm/BC_bot_Earth.txt
out_name: Earth.vul

# ====== Setting up the elemental abundance ======
use_solar: false
O_H: 0.000515253
ini_mix: const_mix
const_mix:
  N2: 0.78
  O2: 0.2
  H2O: 1.0e-06
  CO2: 0.0004
  SO2: 2.0e-10

# ====== Setting up photochemistry ======
r_star: 1
Rp: 637810000.0
Mp: 5.973144212546634e+27
orbit_radius: 1
sl_angle: 1.01229
f_diurnal: 0.5
scat_sp:
- N2
- O2
T_cross_sp:
- CO2
- H2O
- NH3

# ====== Setting up the atmosphere ======
atm_base: N2
rocky: true
nz: 120
P_b: 1000000.0
P_t: 0.05

# ====== Setting up the boundary conditions ======
use_botflux: true
use_fix_sp_bot:
  H2O: 0.00894
  H2O_l_s: 0
  CO2: 0.0004
  O2: 0.2
diff_esc:
- H2
- H
# NH3 + CH -> NH2 + CH2 and its reverse, as the example removes them (positions checked against the equation, C14).
remove_list:
- 315
- 316

# ====== Condensation ======
use_relax:
- H2O
- H2SO4
use_condense: true
use_settling: true
stop_conden_time: 500000000.0
condense_sp:
- H2O
- H2SO4
non_gas_sp:
- H2O_l_s
- H2SO4_l
r_p:
  H2O_l_s: 0.01
  H2SO4_l: 0.0001
rho_p:
  H2O_l_s: 0.9
  H2SO4_l: 1.8302
fix_species:
- H2O
- H2O_l_s
- H2SO4
- H2SO4_l
humidity: 0.25
use_ini_cold_trap: true

# ====== Steady-state check and step control ======
count_max: 20000
mtol_conv: 1.0e-16
loss_eps: 1.0e+12
# The column is open (bottom fluxes and pins): no closed element budget to certify.
element_budget_tol: .inf
rtol: 1.0
post_conden_rtol: 0.05

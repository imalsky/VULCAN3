# VULCAN3 configuration -- HD 189733 b, VULCAN 3 preset.
#
# The VULCAN 3 configuration: HD189.yaml's physics with
# the numerics of shami-EEG/VULCAN `vm_branch` (the commit tests/science_sources.yaml
# pins), the branch VULCAN 3 is being built from. Use HD189.yaml for a VULCAN 2 parity
# run against exoclime/VULCAN `master`; use this one to exercise the VULCAN 3
# feature set.
#
# Overlays default.yaml (which is HD189.yaml): only the knobs that differ are
# set here. Every knob below but out_name is a vm_branch value, cited to the
# fetched file. Mp keeps VULCAN 2's gs = 2140 cm/s^2; vm_branch ships
# 1.118 M_Jup (gs 2139.77).
#
# Authored surface: edit values here (or a CWD ./configs/HD189_vulcan3.yaml).
# Derived at load time (see config._DERIVED), do NOT add here:
#   dt_max = min(runtime*1e-5, 1e15), photo_switch_longdy_thresh = yconv_min*10,
#   para_anaTP = para_warm.

# ====== Setting up paths and filenames for the input and output files ======
out_name: HD189_vulcan3.vul
# The star, stated with default.yaml's values so the case names its own (as HD189.yaml does).
sflux_file: atm/stellar_flux/sflux-HD189_Moses11.txt

# ====== Setting up photochemistry ======
r_star: 0.805
orbit_radius: 0.03142

# ====== Setting up numerical parameters for the ODE solver ======
# vm_branch vulcan_cfg.py:121 -- count_max = int(2E4)
count_max: 20000
# vm_branch vulcan_cfg.py:124 (master ships 1e-20)
mtol_conv: 1.0e-18

# ====== Advanced setup (don't change the values if not sure) ======
# vm_branch vulcan_cfg.py:147-148 -- upwind molecular diffusion, then the
# in-loop flip to central difference. Phase 0 hands over on convergence,
# runtime, or step count, so a run that stops on the loop's own test is in the
# central phase; it is a central-difference fixed point only when it also
# converged (end_case 1).
use_vm_mol: true
use_hybrid_vm_mol: true
# vm_branch vulcan_cfg.py:149-151. Not a temperature clip: it lifts the bottom to
# the deepest level at P >= high_temp_cut_P cooler than high_temp_cut_K and
# re-grids. Inert on this planet (the profile peaks at 2600 K at P >= 1 bar;
# its hot rows are at the top, which the cut ignores); set to match
# vm_branch, not to validate the feature.
high_temp_cut: true
# shami-EEG/VULCAN vm_branch vulcan_cfg.py:157; exoclime master's root
# vulcan_cfg.py ships the same ['HC3N'] (only its HD189 example ships []).
# This single entry is the VULCAN 3 value.
conver_ignore:
- HC3N

# ====== Setting up numerical parameters for the Ros2 ODE solver ======
# vm_branch vulcan_cfg.py:161
rtol: 0.25
# vm_branch vulcan_cfg.py:160 + op.py:836-851. The adaptive-rtol
# differences between master and vm_branch are the decrease factor (0.75 ->
# 0.5) and rtol_min (0.02 -> 0.01); the periods and the increase factor are
# the same.
use_adapt_rtol: true
rtol_min: 0.01
rtol_max: 2.5

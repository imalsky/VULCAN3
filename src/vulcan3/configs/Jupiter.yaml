# VULCAN3 configuration (Jupiter). Overlays default.yaml: only the knobs that
# differ from it are set here; every other knob takes its default.yaml value.
# Derived at load time (see config._DERIVED), do NOT add here:
#   dt_max = min(runtime*1e-5, 1e15), photo_switch_longdy_thresh = yconv_min*10,
#   para_anaTP = para_warm.
# Gravity is derived as gs = G*Mp/Rp^2 (set Mp + Rp, not gs).
#
# VULCAN 2's Jupiter example (cfg_examples/vulcan_cfg_Jupiter.py of the pinned clones): a deep column with water and
# ammonia clouds and a top inflow of H, H2O, CO and CO2. Network, atm, top-flux and stellar files are the pinned
# clones' (tests/science_sources.yaml).
# The seed is the ExoGibbs one, so deep H2O sits above the example's FastChem value, and the trace ammonia ice above
# the cloud top is whatever the pin step froze (notes "Earth and K2-18b", the Jupiter entry).

# ====== Setting up paths and filenames for the input and output files ======
network: thermo/NCHO_photo_network_lowT_Jupiter.txt
use_lowT_limit_rates: true
atm_file: atm/Jupiter_deep_top.txt
sflux_file: atm/stellar_flux/Gueymard_solar.txt
top_BC_flux_file: atm/BC_top_Jupiter.txt
out_name: Jupiter.vul

# ====== Setting up the elemental abundance ======
use_solar: false
O_H: 0.00030309
C_H: 0.00119
N_H: 0.00022755134
He_H: 0.0785

# ====== Setting up photochemistry ======
r_star: 1
Rp: 7149200000.0
# Back-solved so G*Mp/Rp^2 = 2479 cm/s^2, the example's gs.
Mp: 1.8983911320522003e+30
orbit_radius: 5.2
sl_angle: 1.0471966666666666
f_diurnal: 0.5

# ====== Setting up the atmosphere ======
P_b: 5.0e+9

# ====== Setting up the boundary conditions ======
use_topflux: true

# ====== Condensation ======
use_relax:
- H2O
- NH3
use_condense: true
use_settling: true
start_conden_time: 1000000.0
stop_conden_time: 100000000.0
condense_sp:
- H2O
- NH3
non_gas_sp:
- H2O_l_s
- NH3_l_s
r_p:
  H2O_l_s: 5.0e-05
  NH3_l_s: 5.0e-05
rho_p:
  H2O_l_s: 0.9
  NH3_l_s: 0.7
fix_species:
- H2O
- NH3
- H2O_l_s
- NH3_l_s
use_ini_cold_trap: true

# ====== Steady-state check and step control ======
mtol: 1.0e-18
mtol_conv: 1.0e-16
loss_eps: 1.0e+12
# The column is open (top fluxes and the cold-trap pins): no closed element budget to certify.
element_budget_tol: .inf
rtol: 0.05
post_conden_rtol: 0.15

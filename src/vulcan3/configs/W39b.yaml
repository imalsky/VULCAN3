# VULCAN3 configuration (W39b). Overlays default.yaml: only the knobs that
# differ from it are set here; every other knob takes its default.yaml value.
# Authored surface: edit values here (or a CWD ./configs/W39b.yaml override).
# Derived at load time (see config._DERIVED), do NOT add here:
#   dt_max = min(runtime*1e-5, 1e15), photo_switch_longdy_thresh = yconv_min*10,
#   para_anaTP = para_warm.
# Gravity is derived as gs = G*Mp/Rp^2 (set Mp + Rp, not gs).

# ====== Setting up the elements included in the network ======
atom_list:
- H
- O
- C
- N
- S

# ====== Setting up paths and filenames for the input and output files ======
network: thermo/SNCHO_photo_network_2025.txt
atm_file: atm/atm_W39b_evening_TP_Kzz.txt
sflux_file: atm/stellar_flux/sflux-W39b_Tsai2023.txt
vul_ini: output/W39b-nominal.vul
out_name: W39b.vul

# ====== Setting up the elemental abundance ======
use_solar: false
# C/N/O/S: Lodders 2020 Table 8 present-day solar (log eps C 8.47, N 7.85,
# O 8.73, S 7.15; arXiv:1912.00844) times 10, the set upstream vulcan_cfg.py
# carries as "Table 8. K.Lodders 2019". He_H 0.0838 (10.924 dex) is the same
# table; on the EQ seed path the .dat file's He row supplies it.
O_H: 0.00537
C_H: 0.00295
N_H: 0.000708
S_H: 0.000141
# EQ ignores He_H for the shipped atom_list; const_lowT reads it.
He_H: 0.0838
const_mix:
  CH4: 0.0059
  O2: 0.0004807
  He: 0.0838
  N2: 0.000354
  H2: 0.9764

# ====== Setting up photochemistry ======
r_star: 0.932
Rp: 9143826800.0
orbit_radius: 0.04828
sl_angle: 1.4486220555555556
Mp: 5.2864327236450345e+29

# ====== Setting up parameters for the atmosphere ======
P_b: 7600000.0
P_t: 0.1

# ====== Setting up numerical parameters for the ODE solver ======
count_max: 30000

# ====== Advanced setup (don't change the values if not sure) ======
ini_update_photo_frq: 5

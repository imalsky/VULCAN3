# VULCAN3 configuration (default).
# Authored surface: edit values here (or a CWD ./configs/default.yaml override).
# Derived at load time (see config._DERIVED), do NOT add here:
#   dt_max = min(runtime*1e-5, 1e15), photo_switch_longdy_thresh = yconv_min*10,
#   para_anaTP = para_warm.
# Gravity is derived as gs = G*Mp/Rp^2 (set Mp + Rp, not gs).

# ====== Setting up the elements included in the network ======
atom_list:
- H
- O
- C
- N

# ====== Setting up paths and filenames for the input and output files ======
network: thermo/NCHO_photo_network.txt
use_lowT_limit_rates: false
cross_folder: thermo/photo_cross/
com_file: thermo/all_compose.txt
atm_file: atm/atm_HD189_Kzz.txt
sflux_file: atm/stellar_flux/sflux-HD189_Moses11.txt
top_BC_flux_file: null  # set when use_topflux is on (see atm/BC_top_*.txt)
bot_BC_flux_file: null  # set when use_botflux/use_fix_sp_bot is on (see atm/BC_bot_*.txt)
vul_ini: output/HD189-nominal.vul
output_dir: output/
out_name: HD189.vul

# ====== Setting up the elemental abundance ======
# EQ takes the selected abundance file unchanged; the *_H values
# below are inactive unless the initialization mode/settings change.
use_solar: true
O_H: 0.00060618
C_H: 0.00027761
N_H: 8.1853e-05
# EQ ignores S_H when S is absent from atom_list.
S_H: 1.3183e-05
# EQ ignores He_H for the shipped atom_list; const_lowT reads it.
He_H: 0.09692
ini_mix: EQ
# Seed abundances. solar_element_abundances.dat (default): rocky elements at
# -3.0, for networks with no Mg/Si/Fe species. ..._lodders2009.dat: all solar
# (upstream's file). Match this file before comparing with VULCAN 2.
fastchem_solar_abundance_file: thermo/solar_element_abundances.dat
const_mix:
  CH4: 0.00055522
  O2: 0.0004807
  He: 0.09691
  N2: 8.1853e-05
  H2: 0.99888956
# Shared by the EQ Gibbs seed and the const_lowT Newton solve. 450 is 2.1x
# the worst iteration count measured over the prior box (214, an isothermal
# 300 K column); the loop exits on the residual, so headroom costs nothing.
fastchem_newton_tol: 1.0e-12
fastchem_newton_max_iter: 450

# ====== Setting up photochemistry ======
use_photo: true
r_star: 0.805
Rp: 8135789599.999999
# Back-solved so G*Mp/Rp^2 = 2140 cm/s^2, VULCAN 2's adopted gs (Tsai+2017
# sec 3.1).
Mp: 2.1223033871582308e+30
orbit_radius: 0.03142
sl_angle: 0.8377573333333332
f_diurnal: 1.0
scat_sp:
- H2
- He
T_cross_sp: []

# ====== Setting up ionchemistry ======
use_ion: false

# ====== Setting up parameters for the atmosphere ======
atm_base: H2
rocky: false
nz: 150
P_b: 1000000000.0
P_t: 0.01
use_Kzz: true
use_vz: false
atm_type: file
Kzz_prof: file
K_max: 100000.0
K_p_lev: 0.1
K_deep: 0.0  # Kzz_prof JM16 only: deep Kzz floor (cm^2/s); 0 = no floor
vz_prof: const
Tiso: 1000
para_warm:
- 120.0
- 1500.0
- 0.1
- 0.02
- 1.0
- 1.0
const_Kzz: 10000000000.0
const_vz: 0

# ====== Setting up the boundary conditions ======
use_topflux: false
use_botflux: false
use_fix_sp_bot: {}
diff_esc: []
max_flux: 10000000000000.0
# Only read when use_fix_H2He is true: the model time at which the H2/He
# bottom mixing ratios are snapshotted and pinned. Inert otherwise.
hycean_pin_time: 1000000.0
use_fix_H2He: false

# ====== Reactions to be switched off ======
remove_list: []

# ====== Condensation ======
use_relax: []
use_condense: false
use_settling: false
start_conden_time: 0
stop_conden_time: 100000.0
condense_sp: []
non_gas_sp: []
r_p:
  H2O_l_s: 0.005
rho_p:
  H2O_l_s: 1
fix_species: []
fix_species_from_coldtrap_lev: true
humidity: 1.0
use_ini_cold_trap: false
use_sat_surfaceH2O: false

# ====== Setting up numerical parameters for the ODE solver ======
use_print_prog: true
# The CLI runs in chunks of this many steps: a progress block after each
# (with use_print_prog), and Ctrl+C keeps the last finished chunk.
print_prog_num: 500
dttry: 1.0e-10
trun_min: 100.0
runtime: 1.0e+22
# s. Under the shortest chemical lifetime on a shipped network by enough for the error estimate to pass: a failure at
# the floor keeps the state (notes "Differences from VULCAN master").
dt_min: 1.0e-15
dt_var_max: 2.0
dt_var_min: 0.5
count_min: 120
count_max: 10000
atol: 0.1
mtol: 1.0e-22
mtol_conv: 1.0e-20
pos_cut: 0
# cm^-3, absolute: a trial below it rejects the step. HD189 photo off reaches -1075 (notes "Forward mode").
nega_cut: -1.0e+4
loss_eps: 0.1
yconv_cri: 0.01
slope_cri: 0.0001
yconv_min: 0.1
# The loose branch's slope threshold (s^-1): longdydt must fall below min over the interfaces of
# Kzz / (slope_min_hp_frac * Hp)^2, capped at slope_min_cap and floored at slope_min_floor. These are VULCAN 2's own
# values (op.py:1028-1029). Every shipped run exits on the loose branch, so changing them changes what "converged"
# means.
slope_min_hp_frac: 0.1
slope_min_cap: 1.0e-8
slope_min_floor: 1.0e-10
flux_cri: 0.1
flux_atol: 1.0
loss_ex: []

# ====== Advanced setup (don't change the values if not sure) ======
edd: 0.5
dbin1: 0.1
dbin2: 2.0
dbin_12trans: 240.0
# Photolysis wavelength window (nm): the stellar-flux span is clamped to it before the bins are built (VULCAN 2's
# 2 and 700 nm, store.py:79-80). The cross sections and dissociation thresholds then narrow it further.
photo_lambda_min: 2.0
photo_lambda_max: 700.0
ini_update_photo_frq: 100
final_update_photo_frq: 5
use_moldiff: true
use_vm_mol: false
use_hybrid_vm_mol: false
high_temp_cut: false
high_temp_cut_K: 3500.0
high_temp_cut_P: 1000000.0
update_frq: 100
st_factor: 0.5
conv_step: 500
# Certificate term with no VULCAN 2 counterpart: end only if the
# refreshed geometry moved less than this.
geom_conv_tol: 1.0e-3
# Certificate term with no VULCAN 2 counterpart: end only if every element's
# operator-weighted column, relative to H, is within this of its t=0 value;
# loss_eps bounds only the per-step change. It assumes a closed column:
# boundary fluxes and bottom or fix_species pins count as drift; for such a
# column, .inf switches the term off.
element_budget_tol: 1.0e-2
# The pinned HD189 example's [] (cfg_examples/vulcan_cfg_HD189.py:148).
conver_ignore: []
photo_switch_longdydt_thresh: 1.0e-06

# ====== Setting up numerical parameters for the Ros2 ODE solver ======
rtol: 0.2
post_conden_rtol: 0.1
use_adapt_rtol: false
rtol_min: 0.0
rtol_max: 1.0
loss_criteria: 0.0005
adapt_rtol_dec_period: 10
adapt_rtol_inc_period: 1000
adapt_rtol_dec: 0.5
adapt_rtol_inc: 1.25
adapt_rtol_loss_mul: 2.0
adapt_rtol_inc_loss_thresh: 0.0002
# 110 so `dt < dt_min` ends a reject chain, as master does.
batch_max_retries: 110
# OuterLoop.run_queue tail compaction (no physics): once no job is pending
# and the live lanes fit a rung, they continue at that narrower width,
# e.g. [264, 132] on 792 lanes. [] is off.
queue_compact: []
step_size_safety: 0.9
step_size_zero_delta_frac: 0.01

# ====== Setting up output and plotting ======
save_evolution: false
save_evo_frq: 10
# End-of-run plots (needs matplotlib): final mixing ratios (plot_end) and
# their evolution at 1 mbar (plot_evo), for plot_spec, to plot_dir.
use_plot_end: false
use_plot_evo: false
plot_dir: plot/
plot_spec:  # species every shipped network carries
- H2O
- CH4
- CO
- CO2

# VULCAN3 configuration (default).
# Authored surface: edit values here (or a CWD ./configs/default.yaml override).
# Derived at load time (see config._DERIVED), do NOT add here:
#   dt_max = min(runtime*1e-5, 1e15), photo_switch_longdy_thresh = yconv_min*10,
#   para_anaTP = para_warm.
# Gravity is derived as gs = G*Mp/Rp^2 (set Mp + Rp, not gs).

# ====== Setting up the elements included in the network ======
atom_list:  # elements in the network, used to check element conservation
- H
- O
- C
- N

# ====== Setting up paths and filenames for the input and output files ======
network: thermo/NCHO_photo_network.txt  # path to the chemical network file
use_lowT_limit_rates: false
cross_folder: thermo/photo_cross/  # path to the photolysis cross sections
com_file: thermo/all_compose.txt  # file of basic chemistry properties
atm_file: atm/atm_HD189_Kzz.txt  # T-P and Kzz (optional) file
# stellar flux file; the flux density is defined at the stellar surface
sflux_file: atm/stellar_flux/sflux-HD189_Moses11.txt
top_BC_flux_file: null  # set when use_topflux is on (see atm/BC_top_*.txt)
bot_BC_flux_file: null  # set when use_botflux/use_fix_sp_bot is on (see atm/BC_bot_*.txt)
vul_ini: output/HD189-nominal.vul  # file that initializes the abundances when ini_mix is vulcan_ini
output_dir: output/  # output path
out_name: HD189.vul  # output file name

# ====== Setting up the elemental abundance ======
# EQ takes the selected abundance file unchanged; the *_H values
# below are inactive unless the initialization mode/settings change.
use_solar: true
O_H: 0.00060618  # O to H ratio; only read when use_solar is false
C_H: 0.00027761  # C to H ratio; only read when use_solar is false
N_H: 8.1853e-05  # N to H ratio; only read when use_solar is false
# EQ ignores S_H when S is absent from atom_list.
S_H: 1.3183e-05
# EQ ignores He_H for the shipped atom_list; const_lowT reads it.
He_H: 0.09692
ini_mix: EQ  # initial abundances: EQ, const_mix, const_lowT, vulcan_ini or table (vulcan_ini needs the same T-P grids)
# Seed abundances. solar_element_abundances.dat (default): rocky elements at
# -3.0, for networks with no Mg/Si/Fe species. ..._lodders2009.dat: all solar
# (upstream's file). Match this file before comparing with VULCAN 2.
fastchem_solar_abundance_file: thermo/solar_element_abundances.dat
# Fraction of each element's bulk abundance removed by condensates of elements
# outside the network (silicates take O; FeS takes S in cool planets), e.g.
# {O: 0.2, S: 0.1}. Each key an element of atom_list other than H, each value
# 0 <= f < 1. Applied once to the EQ seed's elemental vector, after every
# override; EQ only. {} is none.
sequestered_frac: {}
const_mix:  # uniform (constant with pressure) mixing ratios; only read when ini_mix is const_mix
  CH4: 0.00055522
  O2: 0.0004807
  He: 0.09691
  N2: 8.1853e-05
  H2: 0.99888956
# Shared by the EQ Gibbs seed and the const_lowT Newton solve. 450 is 2.1x
# the worst iteration count measured over the prior box (214, an isothermal
# 300 K column); the loop exits on the residual, so headroom costs nothing.
fastchem_newton_tol: 1.0e-12
fastchem_newton_max_iter: 450

# ====== Setting up photochemistry ======
use_photo: true  # include photochemistry
r_star: 0.805  # stellar radius, solar radii
Rp: 8135789599.999999  # planet radius, cm; used to compute gravity
# Back-solved so G*Mp/Rp^2 = 2140 cm/s^2, VULCAN 2's adopted gs (Tsai+2017
# sec 3.1).
Mp: 2.1223033871582308e+30
orbit_radius: 0.03142  # planet-star distance, AU
sl_angle: 0.8377573333333332  # zenith angle of the star, rad (58 deg is the usual dayside average)
f_diurnal: 1.0  # factor on all photolysis rates for the diurnal average (0.5 for Earth, 1 for tidally locked planets)
scat_sp:  # bulk gases that contribute to Rayleigh scattering
- H2
- He
T_cross_sp: []  # species with T-dependent cross sections; slower start

# ====== Setting up ionchemistry ======
use_ion: false  # include ion chemistry

# ====== Setting up parameters for the atmosphere ======
# bulk gas of the atmosphere (H2, N2, O2, CO2); sets molecular diffusion, thermal diffusion factor and settling velocity
atm_base: H2
rocky: false  # true puts Rp and the surface gravity at the bottom layer; false at the 1 bar level
nz: 150  # number of vertical layers
P_b: 1000000000.0  # pressure at the bottom, dyn cm^-2
P_t: 0.01  # pressure at the top, dyn cm^-2
use_Kzz: true  # include eddy diffusion
use_vz: false  # include vertical advection
atm_type: file  # how P-T is prescribed: isothermal, analytical, file, vulcan_ini or table
Kzz_prof: file  # eddy-diffusion profile: const, JM16, file or Pfunc (Kzz rises as P^-0.4 above K_p_lev)
K_max: 100000.0  # for Kzz_prof Pfunc: Kzz of the constant part, cm^2 s^-1
# for Kzz_prof Pfunc: level where constant Kzz changes to P^-0.4 Kzz, usually the convective-radiative boundary, bar
K_p_lev: 0.1
K_deep: 0.0  # Kzz_prof JM16 only: deep Kzz floor (cm^2/s); 0 = no floor
vz_prof: const  # vertical advection profile: const or file
Tiso: 1000  # temperature, K; only read when atm_type is isothermal
para_warm:  # analytical T-P parameters T_int, T_irr, ka_L, ka_S, beta_S, beta_L; only read when atm_type is analytical
- 120.0
- 1500.0
- 0.1
- 0.02
- 1.0
- 1.0
# Kzz for constant eddy diffusion, cm^2 s^-1; only read when use_Kzz is true and Kzz_prof is const
const_Kzz: 10000000000.0
const_vz: 0  # vertical wind, cm s^-1; only read when use_vz is true and vz_prof is const

# ====== Setting up the boundary conditions ======
use_topflux: false  # apply the upper boundary conditions from top_BC_flux_file
use_botflux: false  # apply the lower boundary conditions from bot_BC_flux_file
use_fix_sp_bot: {}  # fixed mixing ratios at the lower boundary (e.g. {H2O: 0.01} fixes [H2O] = 0.01 at the surface)
diff_esc: []  # species with diffusion-limited escape at the top of the atmosphere
max_flux: 10000000000000.0  # upper limit for the diffusion-limited fluxes
# Only read when use_fix_H2He is true: the model time at which the H2/He
# bottom mixing ratios are snapshotted and pinned. Inert otherwise.
hycean_pin_time: 1000000.0
use_fix_H2He: false

# ====== Reactions to be switched off ======
remove_list: []  # reactions switched off, usually in forward/reverse pairs, e.g. [1, 2]

# ====== Condensation ======
use_relax: []
use_condense: false  # include condensation reactions
use_settling: false  # include gravitational settling of particles
start_conden_time: 0  # time to start condensation
stop_conden_time: 100000.0  # after this time the condensable species are fixed
condense_sp: []  # condensable species
non_gas_sp: []  # non-gaseous species (e.g. H2O_l_s)
r_p:  # particle radius, cm
  H2O_l_s: 0.005
rho_p:  # particle density, g cm^-3
  H2O_l_s: 1
fix_species: []  # condensable species to fix once condensation-evaporation equilibrium is reached
fix_species_from_coldtrap_lev: true
humidity: 1.0
use_ini_cold_trap: false
use_sat_surfaceH2O: false

# ====== Setting up numerical parameters for the ODE solver ======
use_print_prog: true  # print some integration info
# The CLI runs in chunks of this many steps: a progress block after each
# (with use_print_prog), and Ctrl+C keeps the last finished chunk.
print_prog_num: 500
dttry: 1.0e-10  # starting timestep, s
trun_min: 100.0  # minimum of total model time, s
runtime: 1.0e+22  # maximum of total model time, s
# The shortest step, s: far enough below the shortest chemical lifetime on a shipped network that the error estimate
# passes there. A failure at the floor keeps the state (notes "Differences from VULCAN master").
dt_min: 1.0e-15
dt_var_max: 2.0  # upper constraint on varying the timestep
dt_var_min: 0.5  # lower constraint on varying the timestep
count_min: 120  # minimum of total number of steps
count_max: 10000  # maximum of total number of steps
atol: 0.1  # absolute tolerance; abundances below it are ignored (try decreasing it if the solutions are not stable)
mtol: 1.0e-22  # relative tolerance for adjusting the stepsize; mixing ratios below it are ignored
mtol_conv: 1.0e-20  # relative tolerance for checking steady state
pos_cut: 0  # clipping of small numbers (normally not needed)
loss_eps: 0.1  # criterion for element conservation
yconv_cri: 0.01  # dy for checking steady state
slope_cri: 0.0001  # dy/dt for checking steady state
yconv_min: 0.1  # alternative condition for checking steady state
# The loose branch's slope threshold (s^-1): longdydt must fall below min over the interfaces of
# Kzz / (slope_min_hp_frac * Hp)^2, capped at slope_min_cap and floored at slope_min_floor. These are VULCAN 2's own
# values (op.py:1028-1029). Every shipped run exits on the loose branch, so changing them changes what "converged"
# means.
slope_min_hp_frac: 0.1
slope_min_cap: 1.0e-8
slope_min_floor: 1.0e-10
flux_cri: 0.1  # threshold of the change of actinic flux for checking steady state
flux_atol: 1.0  # absolute tolerance for the actinic flux, photons cm^-2 s^-1 nm^-1
loss_ex: []

# ====== Advanced setup (don't change the values if not sure) ======
edd: 0.5  # Eddington coefficient
dbin1: 0.1  # uniform bin width below dbin_12trans, nm
dbin2: 2.0  # uniform bin width above dbin_12trans, nm
dbin_12trans: 240.0  # wavelength where the bin width switches from dbin1 to dbin2, nm
# Photolysis wavelength window (nm): the stellar-flux span is clamped to it before the bins are built (VULCAN 2's
# 2 and 700 nm, store.py:79-80). The cross sections and dissociation thresholds then narrow it further.
photo_lambda_min: 2.0
photo_lambda_max: 700.0
ini_update_photo_frq: 100  # steps between updates of the actinic flux and optical depth, before the photo switch
final_update_photo_frq: 5  # steps between updates of the actinic flux and optical depth, after the photo switch
use_moldiff: true  # include molecular diffusion
use_vm_mol: false  # use the upwind scheme for molecular diffusion
use_hybrid_vm_mol: false
hybrid_central_steps: 2000  # accepted steps the central phase gets after the upwind phase converges (vm_branch op.py:1108)
hybrid_central_steps_capped: 1000  # accepted steps it gets after the upwind phase hits runtime or count_max (op.py:1129)
high_temp_cut: false  # lift the bottom above deep layers hotter than high_temp_cut_K, then re-grid (no T clip)
high_temp_cut_K: 3500.0  # upper T limit, K
high_temp_cut_P: 1000000.0  # dyn cm^-2; the cut is only considered at P at or above it (about 1 bar)
update_frq: 100  # frequency, in steps, to update dz and dzi for the change of mean molecular weight
st_factor: 0.5  # steady state is checked over this fraction of the integration time
conv_step: 500  # cap on the steps looked back in the steady-state check (500: compare step N-500 with N at most)
# Certificate term with no VULCAN 2 counterpart: end only if the
# refreshed geometry moved less than this.
geom_conv_tol: 1.0e-3
# Certificate term with no VULCAN 2 counterpart: end only if every element's
# operator-weighted column, relative to H, is within this of its t=0 value;
# loss_eps bounds only the per-step change. It assumes a closed column:
# boundary fluxes and bottom or fix_species pins count as drift; for such a
# column, .inf switches the term off.
element_budget_tol: 1.0e-2
# The pinned HD189 example's [] (cfg_examples/vulcan_cfg_HD189.py:148).
conver_ignore: []
photo_switch_longdydt_thresh: 1.0e-06

# ====== Setting up numerical parameters for the Ros2 ODE solver ======
rtol: 0.2  # relative tolerance for adjusting the stepsize
post_conden_rtol: 0.1  # rtol switches to this value once fix_species pins
use_adapt_rtol: false
# Floor of the adapted rtol, VULCAN 2's value (vulcan_cfg.py:159). Without one, an open column halves rtol
# every adapt_rtol_dec_period steps until loss_criteria passes its atom loss. Read only under use_adapt_rtol.
rtol_min: 0.02
rtol_max: 1.0
loss_criteria: 0.0005
adapt_rtol_dec_period: 10
adapt_rtol_inc_period: 1000
adapt_rtol_dec: 0.5
adapt_rtol_inc: 1.25
adapt_rtol_loss_mul: 2.0
adapt_rtol_inc_loss_thresh: 0.0002
# 110 so `dt < dt_min` ends a reject chain, as master does.
batch_max_retries: 110
# OuterLoop.run_queue tail compaction (no physics): once no job is pending
# and the live lanes fit a rung, they continue at that narrower width,
# e.g. [264, 132] on 792 lanes. [] is off.
queue_compact: []
step_size_safety: 0.9
step_size_zero_delta_frac: 0.01

# ====== Setting up output and plotting ======
save_evolution: false  # save the evolution of chemistry (y_time and t_time) every save_evo_frq steps
save_evo_frq: 10  # save every N steps when save_evolution is true
# End-of-run plots (needs matplotlib): final mixing ratios (plot_end) and
# their evolution at 1 mbar (plot_evo), for plot_spec, to plot_dir.
use_plot_end: false
use_plot_evo: false  # plot the abundance evolution at the end
plot_dir: plot/  # output path for plots
plot_spec:  # species every shipped network carries
- H2O
- CH4
- CO
- CO2

    sha256: 30a959ea781b633d6659075c70bd023aadecad21a615bee1c646e2b7c4061b9b
    oracle: vulcan2_ncho

  atm/stellar_flux/sflux-W39b_Tsai2023.txt:
    sha256: 7746f9c874101975f4bd33717f8b1fabd47498cf0e19f20f87a7175e8f6c6de0
    oracle: vulcan3_vm_branch
    note: >-
      Upstream's cfg_wasp39b.py selects sflux-wasp39-frances.txt (3ed92cf): the

  thermo/solar_element_abundances.dat:
    sha256: d6ba87026bc7e634c2781177c6b5391c59816d7080244a98d6ad967432d207b7
    oracle: vulcan2_fastchem_ps_order
    diverges: [fastchem_ps_order, lodders2019_rocky_suppressed]

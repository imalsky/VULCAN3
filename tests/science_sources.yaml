  atm/atm_HD209_Kzz.txt:
    sha256: b0603cbc545841fb646ed93ac7f17faef2ad1ebe6050cdfb9cdac9339f7b0c4d
    oracle: vulcan2_ncho

  atm/atm_W39b_evening_TP_Kzz.txt:
    sha256: 73678f0f8bec0e762544b8fd5ccf4a94e88698f025e7082a18c80c2a446b43c8

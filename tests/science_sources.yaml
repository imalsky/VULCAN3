  atm/stellar_flux/sflux-GJ1214.txt:
    sha256: b8c52774e2ce3114e2921e0f0cda952fc9db97a240c6f9c96e73f8df3fc2302a
    oracle: null
    diverges: [gj1214_upstream_regenerated]
